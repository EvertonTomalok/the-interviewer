[project]
name = "interviewer-adapters"
version = "0.1.0"
description = "Everything that touches the world: LLM, speech, storage, persistence, workflow"
requires-python = ">=3.12"
dependencies = [
    "interviewer-core",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "redis>=5.2",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
]

[tool.uv.sources]
interviewer-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interviewer_adapters"]
