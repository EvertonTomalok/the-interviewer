[project]
name = "interviewer-core"
version = "0.1.0"
description = "Pure domain, ports and engine -- no I/O, no framework imports"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interviewer_core"]
