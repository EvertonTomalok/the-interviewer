<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interview</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #edefee;
      --surface: #f8f9f8;
      --ink: #1b2027;
      --muted: #5b6470;
      --accent: #b9820f;
      --accent-ink: #1b2027;
      --line: rgba(27, 32, 39, 0.14);
      --live: #c93f56;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15181d;
        --surface: #1b1f26;
        --ink: #e8e9ea;
        --muted: #98a0aa;
        --accent: #d9a233;
        --accent-ink: #15181d;
        --line: rgba(232, 233, 234, 0.14);
        --live: #e5677c;
      }
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      max-width: 38rem;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
      line-height: 1.5;
    }
    h1.kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.02em;
      color: var(--accent);
      margin: 0 0 1.5rem;
      font-weight: 500;
    }
    button {
      font: inherit;
      font-family: "IBM Plex Sans", sans-serif;
      padding: 0.55rem 1.1rem;
      border-radius: 0.3rem;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
    button.ghost { background: transparent; color: var(--muted); border-color: var(--line); font-size: 0.875rem; padding: 0.4rem 0.8rem; }
    input[type="password"], input[type="text"] {
      font: inherit;
      padding: 0.6rem 0.7rem;
      border-radius: 0.3rem;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      width: 100%;
    }
    .row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin: 0.75rem 0; }
    .panel {
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: var(--surface);
      padding: 1.2rem 1.3rem;
      margin: 1.1rem 0;
    }
    .muted { color: var(--muted); font-size: 0.875rem; }
    .error {
      border: 1px solid var(--live);
      color: var(--live);
      border-radius: 0.4rem;
      padding: 0.7rem 0.9rem;
      margin: 0.9rem 0;
      font-size: 0.875rem;
    }

    /* -- passkey screen ------------------------------------------------- */
    #screen-passkey h2 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: 1.5rem;
      margin: 0 0 0.4rem;
    }

    /* -- header: role + progress ----------------------------------------- */
    .interview-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1rem;
      margin-bottom: 1.3rem;
    }
    .interview-head h2 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: 1.5rem;
      margin: 0;
    }
    .progress {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* -- camera --------------------------------------------------------- */
    .camera-row { display: flex; align-items: center; gap: 0.9rem; }
    video {
      width: 6.5rem; height: 4.6rem; object-fit: cover;
      border-radius: 0.4rem; border: 1px solid var(--line); display: block;
    }

    /* -- transcript, script-style ---------------------------------------- */
    .thread { margin: 1.5rem 0; }
    .turn { padding: 0 0 0 0.9rem; margin: 0 0 1.1rem; border-left: 2px solid var(--line); }
    .turn.candidate { border-left-color: var(--accent); }
    .turn.interviewer { border-left-color: var(--muted); }
    .turn .speaker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0 0 0.25rem;
    }
    .turn.candidate .speaker { color: var(--accent); }
    .turn p.line {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-size: 1rem;
      margin: 0;
      line-height: 1.5;
    }

    /* -- recorder: the hero ----------------------------------------------- */
    .recorder {
      text-align: center;
      padding: 2rem 1.3rem 1.6rem;
    }
    .recorder .prompt {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-size: 1.25rem;
      text-align: left;
      margin: 0 0 1.6rem;
      line-height: 1.4;
    }
    .mic-wrap { position: relative; width: 6.5rem; height: 6.5rem; margin: 0 auto 1rem; }
    .mic-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid var(--live); opacity: 0; transform: scale(0.85);
    }
    .recording .mic-ring {
      animation: pulse-ring 1.6s ease-out infinite;
    }
    @keyframes pulse-ring {
      0% { opacity: 0.55; transform: scale(0.85); }
      100% { opacity: 0; transform: scale(1.35); }
    }
    button.mic-btn {
      position: relative;
      width: 6.5rem; height: 6.5rem;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: "IBM Plex Sans", sans-serif;
      font-weight: 500;
      font-size: 0.875rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 1;
    }
    .recording button.mic-btn { background: var(--live); color: #fff; }
    button.mic-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .waveform {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 3px; height: 1.8rem; margin: 0.9rem 0 0.2rem;
    }
    .waveform span {
      width: 3px; border-radius: 2px; background: var(--live);
      height: 20%;
    }
    .recording .waveform span { animation: bar 0.9s ease-in-out infinite; }
    .waveform span:nth-child(1) { animation-delay: 0s; }
    .waveform span:nth-child(2) { animation-delay: 0.1s; }
    .waveform span:nth-child(3) { animation-delay: 0.2s; }
    .waveform span:nth-child(4) { animation-delay: 0.3s; }
    .waveform span:nth-child(5) { animation-delay: 0.4s; }
    .waveform span:nth-child(6) { animation-delay: 0.3s; }
    .waveform span:nth-child(7) { animation-delay: 0.2s; }
    .waveform span:nth-child(8) { animation-delay: 0.1s; }
    .waveform span:nth-child(9) { animation-delay: 0s; }
    @keyframes bar {
      0%, 100% { height: 20%; }
      50% { height: 90%; }
    }
    .status-text { font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--muted); min-height: 1.2rem; margin-top: 0.7rem; }
    .take-row { display: flex; align-items: center; justify-content: center; gap: 0.7rem; flex-wrap: wrap; margin-top: 0.5rem; }
    audio { max-width: 100%; }

    #screen-done h2 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: 1.5rem;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1 class="kicker">Interview</h1>

  <div id="error" class="error" hidden></div>

  <section id="screen-passkey" class="panel">
    <h2>Enter your passkey</h2>
    <p id="passkey-intro" class="muted">Enter the passkey from your invite link.</p>
    <div class="row">
      <input id="passkey-input" type="password" placeholder="Passkey" autocomplete="off" />
      <button id="passkey-submit" class="primary">Continue</button>
    </div>
    <p id="browse-jobs-link" class="muted" hidden>
      No invite link? <a href="jobs.html">Browse open roles</a> instead.
    </p>
  </section>

  <section id="screen-interview" hidden>
    <div class="interview-head">
      <h2 id="job-title"></h2>
      <span class="progress" id="question-count"></span>
    </div>

    <p id="greeting-text" class="muted" style="margin-top: -0.6rem;"></p>

    <div class="panel">
      <div class="camera-row">
        <button id="camera-toggle" class="ghost">Turn camera on</button>
        <span class="muted">Preview only — nothing is read, uploaded or stored.</span>
      </div>
      <video id="camera-preview" autoplay muted playsinline hidden></video>
    </div>

    <div id="thread" class="thread"></div>

    <div id="recorder-card" class="panel recorder">
      <p id="prompt-text" class="prompt"></p>

      <div class="mic-wrap">
        <div class="mic-ring"></div>
        <button id="record-btn" class="mic-btn">Record</button>
      </div>
      <div class="waveform" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="take-row">
        <button id="stop-btn" hidden>Stop</button>
        <audio id="playback" controls hidden></audio>
      </div>
      <div class="take-row">
        <button id="rerecord-btn" class="ghost" hidden>Re-record</button>
        <button id="send-btn" class="primary" hidden>Send</button>
      </div>
      <p id="status-text" class="status-text"></p>
    </div>

    <div id="closing-card" class="panel" hidden>
      <p id="closing-text" style="font-family: 'IBM Plex Serif', Georgia, serif; font-size: 1.25rem;"></p>
      <button id="finish-btn" class="primary">Finish</button>
    </div>
  </section>

  <section id="screen-done" class="panel" hidden>
    <h2>Sent for review</h2>
    <p class="muted">Thanks for your time — that's everything.</p>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script type="module">
    const $error = $("#error");
    function showError(message) {
      $error.text(message).prop("hidden", false);
    }
    function clearError() {
      $error.prop("hidden", true).text("");
    }

    function slugFromLocation() {
      const match = window.location.pathname.match(/\/i\/([^/]+)/);
      if (match) return match[1];
      const params = new URLSearchParams(window.location.search);
      return params.get("slug") || "";
    }

    const slug = slugFromLocation();
    let candidateToken = null;
    let questionTotal = null;

    // A candidate arriving from jobs.html already has a token -- no passkey
    // screen at all. Read-once: the entry is cleared immediately so a
    // refresh or a second tab doesn't reuse a single-session token.
    function pendingSessionFromJobsPage() {
      let raw;
      try {
        raw = sessionStorage.getItem("pending_session");
      } catch {
        return null;
      }
      if (!raw) return null;
      try {
        sessionStorage.removeItem("pending_session");
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }
    let sending = false;
    let takeBlob = null;
    let takeUrl = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let cameraStream = null;

    async function api(path, options = {}) {
      const headers = Object.assign({}, options.headers || {});
      if (candidateToken) headers["Authorization"] = `Bearer ${candidateToken}`;
      const response = await fetch(path, Object.assign({}, options, { headers }));
      let body;
      try {
        body = await response.json();
      } catch {
        body = null;
      }
      if (response.status === 401) {
        throw new SessionExpiredError();
      }
      if (!response.ok || (body && body.success === false)) {
        const message = (body && body.error) || `request to ${path} failed (${response.status})`;
        throw new Error(message);
      }
      return body ? body.data : null;
    }

    class SessionExpiredError extends Error {}

    $("#passkey-submit").on("click", claim);
    $("#passkey-input").on("keydown", (e) => {
      if (e.key === "Enter") claim();
    });

    async function claim() {
      clearError();
      const passkey = $("#passkey-input").val();
      if (!passkey) return;
      $("#passkey-submit").prop("disabled", true);
      try {
        const data = await api(`/i/${encodeURIComponent(slug)}/claim`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passkey }),
        });
        enterInterview(data);
      } catch (err) {
        showError(
          err.message && err.message.toLowerCase().includes("passkey")
            ? "That passkey doesn't work for this link."
            : "This link isn't valid right now."
        );
      } finally {
        $("#passkey-submit").prop("disabled", false);
      }
    }

    // -- camera preview: video only, never read, never sent -----------------

    const $cameraToggle = $("#camera-toggle");
    const $cameraPreview = $("#camera-preview");
    $cameraToggle.on("click", async () => {
      if (cameraStream) {
        cameraStream.getTracks().forEach((t) => t.stop());
        cameraStream = null;
        $cameraPreview.prop("srcObject", null).prop("hidden", true);
        $cameraToggle.text("Turn camera on");
        return;
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
        $cameraPreview.prop("srcObject", cameraStream).prop("hidden", false);
        $cameraToggle.text("Turn camera off");
      } catch {
        showError("Couldn't access the camera -- you can still continue without it.");
      }
    });

    // -- record / listen back / re-record / send -----------------------------

    const $recordBtn = $("#record-btn");
    const $stopBtn = $("#stop-btn");
    const $rerecordBtn = $("#rerecord-btn");
    const $sendBtn = $("#send-btn");
    const $playback = $("#playback");
    const $statusText = $("#status-text");
    const $micWrap = $(".mic-wrap").parent(); // .recorder panel, drives .recording state

    function resetTake() {
      if (takeUrl) URL.revokeObjectURL(takeUrl);
      takeUrl = null;
      takeBlob = null;
      $playback.prop("hidden", true).removeAttr("src");
      $recordBtn.prop("hidden", false);
      $rerecordBtn.prop("hidden", true);
      $sendBtn.prop("hidden", true);
    }

    $recordBtn.on("click", async () => {
      clearError();
      let micStream;
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch {
        showError("Microphone permission was denied -- allow it to record an answer.");
        return;
      }
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(micStream);
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        micStream.getTracks().forEach((t) => t.stop());
        $micWrap.removeClass("recording");
        if (takeUrl) URL.revokeObjectURL(takeUrl);
        takeBlob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        takeUrl = URL.createObjectURL(takeBlob);
        $playback.attr("src", takeUrl).prop("hidden", false);
        $recordBtn.prop("hidden", true);
        $stopBtn.prop("hidden", true);
        $rerecordBtn.prop("hidden", false);
        $sendBtn.prop("hidden", false);
      };
      mediaRecorder.start();
      $micWrap.addClass("recording");
      $recordBtn.prop("hidden", true);
      $stopBtn.prop("hidden", false);
    });

    $stopBtn.on("click", () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      $stopBtn.prop("hidden", true);
    });

    $rerecordBtn.on("click", () => {
      resetTake();
    });

    $sendBtn.on("click", sendTake);

    async function sendTake() {
      if (sending || !takeBlob) return;
      sending = true;
      $sendBtn.prop("disabled", true);
      clearError();
      $statusText.text("Sending...");
      try {
        const form = new FormData();
        const ext = (takeBlob.type.split("/")[1] || "webm").split(";")[0];
        form.append("file", takeBlob, `take.${ext}`);
        const result = await api("/session/turns", { method: "POST", body: form });
        resetTake();
        $recordBtn.prop("hidden", true); // stays hidden until the poll resolves
        $statusText.text("Processing...");
        await pollTurn(result.run_id);
      } catch (err) {
        if (err instanceof SessionExpiredError) return handleExpired();
        $statusText.text("");
        showError(`That answer didn't go through: ${err.message}. You can try again.`);
        $recordBtn.prop("hidden", false);
      } finally {
        sending = false;
        $sendBtn.prop("disabled", false);
      }
    }

    function appendTurn(role, speakerLabel, text) {
      const $turn = $(`
        <div class="turn ${role}">
          <p class="speaker"></p>
          <p class="line"></p>
        </div>
      `);
      $turn.find(".speaker").text(speakerLabel);
      $turn.find(".line").text(text);
      $("#thread").append($turn);
    }

    async function pollTurn(runId) {
      const deadline = Date.now() + 90_000;
      while (Date.now() < deadline) {
        let state;
        try {
          state = await api(`/session/runs/${runId}`);
        } catch (err) {
          if (err instanceof SessionExpiredError) return handleExpired();
          throw err;
        }
        if (state.status === "failed") {
          throw new Error(state.error || "the turn failed");
        }
        if (state.status === "succeeded") {
          $statusText.text("");
          appendTurn("candidate", "You", state.transcript || "(no transcript)");
          if (state.phase === "closing") {
            showClosing(state);
            return;
          }
          appendTurn("interviewer", "Interviewer", state.question_text || "");
          $("#prompt-text").text(state.question_text || "");
          if (state.question_number != null) {
            $("#question-count").text(`${state.question_number} / ${state.question_total}`);
          }
          if (state.audio_artifact_id) await playInterviewerAudio(state.audio_artifact_id);
          $recordBtn.prop("hidden", false);
          return;
        }
        await new Promise((r) => setTimeout(r, 1200));
      }
      showError("This is taking longer than expected. It's still running -- check back shortly.");
      $recordBtn.prop("hidden", false);
    }

    async function playInterviewerAudio(artifactId) {
      // best-effort: candidate token travels via fetch below,
      // browsers can't attach Authorization to a plain <audio src> request.
      try {
        const response = await fetch(`/session/artifacts/${artifactId}`, {
          headers: { Authorization: `Bearer ${candidateToken}` },
        });
        if (!response.ok) return;
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const el = new Audio(url);
        await el.play().catch(() => {});
      } catch {
        // audio playback is a nice-to-have; a failure here never blocks the interview
      }
    }

    function showClosing(state) {
      $("#recorder-card").prop("hidden", true);
      $("#closing-card").prop("hidden", false);
      $("#closing-text").text(state.question_text || "");
    }

    $("#finish-btn").on("click", finish);

    async function finish() {
      if (sending) return;
      sending = true;
      const $btn = $("#finish-btn");
      $btn.prop("disabled", true);
      clearError();
      try {
        const result = await api("/session/finish", { method: "POST" });
        let state;
        const deadline = Date.now() + 90_000;
        while (Date.now() < deadline) {
          state = await api(`/session/runs/${result.run_id}`);
          if (state.status === "succeeded" || state.status === "failed") break;
          await new Promise((r) => setTimeout(r, 1200));
        }
        if (!state || state.status !== "succeeded") {
          throw new Error((state && state.error) || "finishing timed out");
        }
        $("#screen-interview").prop("hidden", true);
        $("#screen-done").prop("hidden", false);
      } catch (err) {
        if (err instanceof SessionExpiredError) return handleExpired();
        showError(`Couldn't finish the session: ${err.message}`);
      } finally {
        sending = false;
        $btn.prop("disabled", false);
      }
    }

    function handleExpired() {
      candidateToken = null;
      $("#screen-interview").prop("hidden", true);
      $("#screen-passkey").prop("hidden", false);
      showError("This session has expired -- the link has already been used up.");
    }

    function enterInterview(data) {
      candidateToken = data.access_token;
      questionTotal = data.question_total;
      $("#job-title").text(data.title || "");
      $("#greeting-text").text(data.greeting_text);
      $("#question-count").text(questionTotal != null ? `1 / ${questionTotal}` : "");
      $("#prompt-text").text(data.intake_prompt_text || "");
      $("#screen-passkey").prop("hidden", true);
      $("#screen-interview").prop("hidden", false);
    }

    async function loadPreview() {
      try {
        const data = await api(`/i/${encodeURIComponent(slug)}`);
        $("#passkey-intro").text(
          `${data.persona_name}${data.area_name ? " -- " + data.area_name : ""} ` +
          `(${data.question_total} questions). Enter the passkey from your invite link.`
        );
      } catch {
        showError("This link isn't valid right now.");
        $("#passkey-submit").prop("disabled", true);
      }
    }

    const pending = pendingSessionFromJobsPage();
    if (pending) {
      enterInterview(pending);
    } else if (!slug) {
      showError("No invite slug in the link.");
      $("#passkey-submit").prop("disabled", true);
      $("#browse-jobs-link").prop("hidden", false);
    } else {
      loadPreview();
    }
  </script>
</body>
</html>
