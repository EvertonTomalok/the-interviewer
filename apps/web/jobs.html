<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interview a role</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #edefee;
      --surface: #f8f9f8;
      --ink: #1b2027;
      --muted: #5b6470;
      --accent: #b9820f;
      --accent-ink: #1b2027;
      --line: rgba(27, 32, 39, 0.14);
      --live: #c93f56;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15181d;
        --surface: #1b1f26;
        --ink: #e8e9ea;
        --muted: #98a0aa;
        --accent: #d9a233;
        --accent-ink: #15181d;
        --line: rgba(232, 233, 234, 0.14);
        --live: #e5677c;
      }
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      max-width: 42rem;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
      line-height: 1.5;
    }
    .masthead { margin-bottom: 2.5rem; }
    .kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: var(--accent);
      margin: 0 0 0.6rem;
    }
    h1 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: 2.1rem;
      line-height: 1.15;
      margin: 0 0 0.75rem;
      letter-spacing: -0.01em;
    }
    .lede {
      color: var(--muted);
      font-size: 1rem;
      max-width: 34rem;
      margin: 0;
    }
    .roles { border-top: 1px solid var(--line); margin-top: 2.25rem; }
    .role {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.5rem 0 1.5rem 1.5rem;
      border-bottom: 1px solid var(--line);
    }
    .role::before {
      content: "";
      position: absolute;
      left: 0; top: 0.5rem; bottom: 0.5rem;
      width: 3px;
      background: var(--accent);
      opacity: 0;
      transform: scaleY(0.4);
      transform-origin: center;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .role:hover::before { opacity: 1; transform: scaleY(1); }
    .role-info h2 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: 1.2rem;
      margin: 0 0 0.3rem;
    }
    .role-info p {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
      max-width: 28rem;
    }
    .role-info .meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 0.55rem;
    }
    button.start {
      font: inherit;
      font-family: "IBM Plex Sans", sans-serif;
      font-weight: 500;
      font-size: 0.92rem;
      padding: 0.65rem 1.3rem;
      border-radius: 0.3rem;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }
    button.start:hover { filter: brightness(1.06); }
    button.start:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      border: 1px solid var(--live);
      color: var(--live);
      border-radius: 0.4rem;
      padding: 0.7rem 0.9rem;
      margin: 0 0 1.5rem;
      font-size: 0.92rem;
    }
    .empty { color: var(--muted); padding: 2rem 0; }
    [hidden] { display: none !important; }
    @media (max-width: 32rem) {
      .role { flex-direction: column; align-items: flex-start; }
      button.start { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="masthead">
    <p class="kicker">Practice interviews</p>
    <h1>Pick a role, start talking</h1>
    <p class="lede">
      No sign-up, no passkey — the interview starts the moment you pick a
      role. It's voice-only, so allow your microphone when the browser asks.
    </p>
  </div>

  <div id="error" class="error" hidden></div>
  <p id="empty" class="empty" hidden>No roles are open for interviews right now.</p>
  <div id="jobs" class="roles"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script type="module">
    const $error = $("#error");
    function showError(message) {
      $error.text(message).prop("hidden", false);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      let body;
      try {
        body = await response.json();
      } catch {
        body = null;
      }
      if (!response.ok || (body && body.success === false)) {
        const message = (body && body.error) || `request to ${path} failed (${response.status})`;
        throw new Error(message);
      }
      return body ? body.data : null;
    }

    function renderJobs(jobs) {
      const $list = $("#jobs").empty();
      if (jobs.length === 0) {
        $("#empty").prop("hidden", false);
        return;
      }
      for (const job of jobs) {
        const $role = $(`
          <div class="role">
            <div class="role-info">
              <h2></h2>
              <p></p>
              <div class="meta"></div>
            </div>
            <button class="start" type="button">Start interview</button>
          </div>
        `);
        $role.find("h2").text(job.title);
        $role.find("p").text(job.description || "");
        $role.find(".meta").text(`${job.question_total} questions`);
        $role.find("button").on("click", function () {
          startJob(job, $(this));
        });
        $list.append($role);
      }
    }

    async function startJob(job, $button) {
      $button.prop("disabled", true);
      $error.prop("hidden", true);
      try {
        const data = await api(`/jobs/${encodeURIComponent(job.area_id)}/start`, {
          method: "POST",
        });
        // Held only in this tab's session storage -- never localStorage, a
        // shared laptop is the normal case here -- and read once by
        // interview.html, which clears it immediately after.
        sessionStorage.setItem(
          "pending_session",
          JSON.stringify({
            access_token: data.access_token,
            title: data.title,
            greeting_text: data.greeting_text,
            intake_prompt_text: data.intake_prompt_text,
            question_total: data.question_total,
          })
        );
        window.location.href = "interview.html";
      } catch (err) {
        showError(`Couldn't start that interview: ${err.message}`);
        $button.prop("disabled", false);
      }
    }

    (async () => {
      try {
        const data = await api("/jobs");
        renderJobs(data.jobs);
      } catch (err) {
        showError(`Couldn't load the list of roles: ${err.message}`);
      }
    })();
  </script>
</body>
</html>
